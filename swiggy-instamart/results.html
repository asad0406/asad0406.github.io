<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🛵 Swiggy Instamart — Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style id="app-style">
    :root {
      --ink: #1f1b16;
      --paper: #edebdf;
      --card: #ffffff;
      --crate: #2b5235;
      --crate-tint: #e4ede3;
      --brick: #a6402b;
      --brick-tint: #f4e5e0;
      --swiggy: #ff7a1a;
      --swiggy-dim: #e5660a;
      --stone: #5b5648;
      --line: #dcd8c8;
      --display: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 400 13px/1.5 var(--body);
      background: var(--paper);
      color: var(--ink);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--paper);
      border-bottom: 2px solid var(--ink);
      padding: 14px 20px 12px;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-logo {
      font-size: 24px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    }
    .query-tag {
      font-family: var(--display);
      font-weight: 700;
      font-size: 19px;
      letter-spacing: -.01em;
      background: var(--ink);
      color: var(--paper);
      padding: 5px 14px 6px;
      border-radius: 3px;
      transform: rotate(-.6deg);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .query-tag .q-mark {
      color: var(--swiggy);
    }

    #metaCard {
      flex: none;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    #metaCard .stat {
      font-family: var(--display);
      border: 1.5px solid var(--ink);
      border-radius: 3px;
      padding: 5px 11px;
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      background: var(--card);
    }
    #metaCard .stat b {
      color: var(--swiggy-dim);
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: nowrap;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 2px;
    }
    .toolbar::-webkit-scrollbar {
      height: 4px;
    }
    .toolbar::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px;
    }
    .toolbar .spacer {
      flex: 1;
      min-width: 8px;
    }
    input#filter, select.filter-select {
      padding: 6px 11px;
      border: 1.5px solid var(--line);
      border-radius: 20px;
      font-size: 12px;
      background: var(--card);
      color: var(--ink);
      flex: 0 0 auto;
      font-family: var(--body);
      outline: none;
      white-space: nowrap;
    }
    select.filter-select {
      max-width: 140px;
      cursor: pointer;
    }
    input#filter {
      width: 160px;
      flex: 0 1 auto;
    }
    input#filter:focus, select.filter-select:focus {
      border-color: var(--swiggy);
    }
    button.tool-btn {
      padding: 6px 13px;
      border: 1.5px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: 0 0 auto;
      white-space: nowrap;
      font-family: var(--body);
      transition: all 0.15s;
    }
    button.tool-btn:hover {
      border-color: var(--swiggy);
    }
    button.tool-btn.active {
      background: var(--crate);
      border-color: var(--crate);
      color: #fff;
    }
    button.btn-primary {
      background: var(--swiggy);
      border: none;
      color: #ffffff;
      font-family: var(--display);
      font-weight: 700;
      padding: 7px 16px;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    button.btn-primary:hover {
      background: var(--swiggy-dim);
    }

    #tableWrap {
      overflow: auto;
      max-height: calc(100vh - 128px);
      padding: 0 20px 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12.5px;
    }
    thead th {
      position: sticky;
      top: 0;
      background: var(--paper);
      text-align: left;
      padding: 10px 10px 8px;
      border-bottom: 2px solid var(--ink);
      font-weight: 600;
      font-family: var(--display);
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover {
      color: var(--swiggy);
    }
    tbody td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      font-weight: 400;
      max-width: 280px;
      white-space: normal;
      overflow-wrap: break-word;
      vertical-align: middle;
    }
    tbody tr {
      border-left: 4px solid transparent;
      transition: background 0.1s;
    }
    tbody td.nowrap {
      max-width: none;
      white-space: nowrap;
    }
    tbody tr:hover {
      background: #ffffff;
    }
    tbody tr.sold-out {
      background: var(--brick-tint);
      border-left-color: var(--brick);
    }
    tbody tr.sold-out:hover {
      background: #efd6cf;
    }
    tbody tr.in-stock {
      background: var(--crate-tint);
      border-left-color: var(--crate);
    }
    tbody tr.in-stock:hover {
      background: #d6e5d4;
    }
    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-family: var(--display);
      font-weight: 600;
    }
    td a {
      color: var(--swiggy-dim);
      text-decoration: none;
      font-weight: 600;
    }
    td a:hover {
      text-decoration: underline;
    }

    .prod-link {
      color: var(--ink);
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .prod-link:hover {
      color: var(--swiggy-dim);
    }
    .brand-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 2px;
    }
    .qty-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--stone);
    }
    .thumb {
      height: 36px;
      width: 36px;
      object-fit: contain;
      border-radius: 4px;
      vertical-align: middle;
      cursor: zoom-in;
      background: #ffffff;
      border: 1px solid var(--line);
    }
    .thumb-fallback {
      height: 36px;
      width: 36px;
      border-radius: 4px;
      background: var(--card);
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--stone);
      vertical-align: middle;
    }

    .view-btn {
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 5px;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .view-btn:hover {
      border-color: var(--swiggy);
      transform: scale(1.08);
    }

    #empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--stone);
      font-family: var(--display);
      font-size: 15px;
      font-weight: 600;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(31, 27, 22, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: var(--card);
      border-radius: 4px;
      width: 490px;
      max-width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(31,27,22,.4);
      position: relative;
    }
    .modal-card::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, transparent 60%, var(--card) 61%);
    }
    .modal-head {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 20px 20px 16px;
      border-bottom: 2px dashed var(--line);
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 2;
    }
    .modal-head img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: contain;
      flex: none;
      background: var(--paper);
      border: 1px solid var(--line);
    }
    .modal-head .name {
      font-family: var(--display);
      font-weight: 600;
      font-size: 14.5px;
      line-height: 1.3;
      flex: 1;
    }
    .modal-close {
      cursor: pointer;
      color: var(--stone);
      font-size: 14px;
      line-height: 1;
      flex: none;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--paper);
      user-select: none;
    }
    .modal-close:hover {
      background: var(--line);
      color: var(--ink);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 16px 20px;
    }
    .modal-grid .full {
      grid-column: 1 / -1;
    }
    .modal-field .k {
      font-family: var(--display);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--stone);
      margin-bottom: 3px;
      border-left: 2px solid var(--swiggy);
      padding-left: 6px;
    }
    .modal-field .v {
      font-size: 12.5px;
      line-height: 1.45;
      word-break: break-word;
      padding-left: 8px;
    }

    .modal-section {
      padding: 14px 20px 18px;
      border-top: 2px dashed var(--line);
    }
    .modal-section .sec-title {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      border-left: 2px solid var(--swiggy);
      padding-left: 6px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12.5px;
      margin-bottom: 4px;
    }
    .price-row .store {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      flex-wrap: wrap;
    }
    .price-row .amount {
      font-family: var(--display);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      flex: none;
      white-space: nowrap;
    }
    .price-row.best {
      background: var(--crate-tint);
    }
    .price-row.worst {
      background: var(--brick-tint);
    }
    .price-row .amount.best {
      color: var(--crate);
    }
    .price-row .amount.worst {
      color: var(--brick);
    }
    .pill {
      font-family: var(--display);
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      display: inline-block;
      width: fit-content;
      color: #fff;
    }
    .pill.best {
      background: var(--crate);
    }
    .pill.worst {
      background: var(--brick);
    }
    .price-row .soldout {
      color: var(--stone);
      font-size: 11px;
    }

    .price-compare {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .price-card {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 10px 12px;
      border-radius: 4px;
    }
    .price-card.best {
      background: var(--crate-tint);
    }
    .price-card.worst {
      background: var(--brick-tint);
    }
    .price-card .pc-label {
      font-size: 11.5px;
      color: var(--stone);
      margin-top: 3px;
    }
    .pc-amount-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .price-card .pc-amount {
      font-family: var(--display);
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .price-card .pc-amount.best {
      color: var(--crate);
    }
    .price-card .pc-amount.worst {
      color: var(--brick);
    }
    .save-tag {
      font-family: var(--body);
      font-size: 10.5px;
      font-weight: 600;
      color: #fff;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--crate);
    }

    .toggle-stores {
      display: inline-block;
      cursor: pointer;
      color: var(--swiggy-dim);
      font-family: var(--display);
      font-weight: 600;
      font-size: 11.5px;
      margin: 6px 0 0 8px;
      user-select: none;
    }
    .toggle-stores:hover {
      color: var(--ink);
      text-decoration: underline;
    }

    .table-status-bar {
      text-align: center;
      padding: 16px 20px 24px;
      font-size: 12px;
      color: var(--stone);
      font-family: var(--display);
      font-weight: 600;
    }
    #empty {
      text-align: center;
      padding: 60px 20px;
      font-size: 15px;
      color: var(--stone);
      font-family: var(--display);
      font-weight: 600;
    }

    @media (max-width: 800px) {
      header { padding: 12px 14px; }
      .toolbar { gap: 6px; }
      #tableWrap { padding: 0 10px 14px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="top-row">
      <div class="title-row">
        <span class="title-logo">🛵</span>
        <span class="query-tag" id="titleTag">
          <span class="q-mark">#</span><span id="queryLabel">Instamart Hunter</span>
        </span>
      </div>
      <div id="metaCard"></div>
    </div>
    <div class="toolbar">
      <select id="filterStore" class="filter-select">
        <option value="">All stores</option>
      </select>
      <select id="filterBrand" class="filter-select">
        <option value="">All brands</option>
      </select>
      <select id="filterCategory" class="filter-select">
        <option value="">All categories</option>
      </select>
      <select id="filterStock" class="filter-select">
        <option value="">All stock</option>
        <option value="In stock">In stock</option>
        <option value="Sold out">Sold out</option>
      </select>
      <select id="sortSelect" class="filter-select">
        <option value="price-asc">💵 Price: Low to High</option>
        <option value="price-desc">💎 Price: High to Low</option>
        <option value="discount-desc">🔥 Highest Discount %</option>
        <option value="brand-asc">🏷️ Brand: A to Z</option>
        <option value="title-asc">🔤 Product: A to Z</option>
        <option value="store-asc">📍 Store: A to Z</option>
      </select>
      <input id="filter" type="text" placeholder="Search product, brand, store...">
      <button id="filterVariation" class="tool-btn">Price varies by store</button>
      <div class="spacer"></div>
      <button id="download" class="tool-btn btn-primary">Download CSV</button>
    </div>
  </header>

  <div id="tableWrap"></div>

  <script id="app-script">
    const tableWrap = document.getElementById('tableWrap');
    const filterEl = document.getElementById('filter');
    const storeSel = document.getElementById('filterStore');
    const brandSel = document.getElementById('filterBrand');
    const catSel = document.getElementById('filterCategory');
    const stockSel = document.getElementById('filterStock');
    const sortSel = document.getElementById('sortSelect');
    const variationBtn = document.getElementById('filterVariation');

    const PAGE_CHUNK = 100;
    let visibleCount = PAGE_CHUNK;
    let renderedCount = 0;
    let filteredRows = [];

    const COLUMN_ORDER = [
      'store_locality',
      'name',
      'brand',
      'quantity',
      'stock',
      'mrp_inr',
      'selling_price_inr',
      'discount_pct',
      'category',
      'image_1',
      'maps_url'
    ];

    const COLUMN_LABELS = {
      store_locality: 'Store / Locality',
      name: 'Product',
      brand: 'Brand',
      quantity: 'Quantity',
      stock: 'Stock',
      mrp_inr: 'MRP (₹)',
      selling_price_inr: 'Price (₹)',
      discount_pct: 'Discount %',
      category: 'Category',
      image_1: 'Image',
      maps_url: 'Map',
      store_id: 'Store ID',
      store_pincode: 'Pincode',
      store_address: 'Store Address',
      sub_category: 'Sub-category',
      product_id: 'Product ID'
    };

    const DETAIL_COLS = ['store_locality', 'store_id', 'store_pincode', 'brand', 'quantity', 'selling_price_inr', 'mrp_inr', 'discount_pct', 'stock', 'category', 'sub_category', 'store_address'];
    const DETAIL_FULL_WIDTH = new Set(['store_address']);
    const NUMERIC_COLS = new Set(['mrp_inr', 'selling_price_inr', 'discount_pct']);
    const NOWRAP_COLS = new Set(['stock', 'quantity', 'image_1', 'maps_url']);

    const label = c => COLUMN_LABELS[c] || c;

    let DATA = [];
    let allRows = [];
    let currentQuery = '';
    let sortCol = null, sortDir = 1;
    let onlyVariation = false;
    let cheapestByKey = new Map();
    let variantsMap = new Map();

    const variantKey = r => `${r.name || ''}__${r.brand || ''}__${r.quantity || ''}`.trim().toLowerCase();

    function normalizeRow(r) {
      const avail = (r.stock === 'In stock' || r.inStock === true || r.availability === 'IN_STOCK') ? 'In stock' : 'Sold out';
      const title = (r.name || r.title || r.titles?.title || '-').trim();
      const loc = r.store_locality || r.locality || '-';
      const storeId = r.store_id || r.podId || r.storeId || '-';
      const pin = r.store_pincode || r.pincode || '';
      const addr = r.store_address || r.deliveryLocation || '';
      const brand = r.brand || '';
      const qty = r.quantity || '';
      const cat = r.category || '';
      const subCat = r.sub_category || '';

      const searchStr = `${title} ${brand} ${qty} ${loc} ${storeId} ${pin} ${addr} ${cat} ${subCat}`.toLowerCase();

      return {
        store_locality: loc,
        store_id: storeId,
        store_pincode: pin,
        store_address: addr,
        maps_url: r.maps_url || r.mapsUrl || '',
        name: title,
        brand: brand,
        quantity: qty,
        stock: avail,
        mrp_inr: r.mrp_inr != null ? Number(r.mrp_inr) : (r.mrp != null ? Number(r.mrp) : null),
        selling_price_inr: r.selling_price_inr != null ? Number(r.selling_price_inr) : (r.price != null ? Number(r.price) : null),
        discount_pct: r.discount_pct != null ? Number(r.discount_pct) : (r.discount != null ? Number(r.discount) : 0),
        category: cat,
        sub_category: subCat,
        product_id: r.product_id || r.productId || '',
        image_1: r.image_1 || r.imageUrl || '',
        product_url: r.product_url || (r.product_id ? `https://www.swiggy.com/instamart/item/${r.product_id}` : '#'),
        _search: searchStr
      };
    }

    function priceAcrossStores(row) {
      const k = variantKey(row);
      const group = variantsMap.get(k) || [];
      return group
        .filter(r => r.stock === 'In stock' && r.selling_price_inr != null)
        .map(r => ({ store: r.store_locality, price: r.selling_price_inr, stock: r.stock }))
        .sort((a, b) => a.price - b.price);
    }

    function computeVariationKeys() {
      const byKey = new Map();
      variantsMap = new Map();

      for (let i = 0; i < allRows.length; i++) {
        const r = allRows[i];
        const k = variantKey(r);
        let group = variantsMap.get(k);
        if (!group) {
          group = [];
          variantsMap.set(k, group);
        }
        group.push(r);

        if (r.stock !== 'In stock' || r.selling_price_inr == null) continue;
        const price = r.selling_price_inr;
        const e = byKey.get(k);
        if (!e) byKey.set(k, { min: price, max: price, cheapest: r });
        else {
          e.min = Math.min(e.min, price);
          e.max = Math.max(e.max, price);
          if (price < (e.cheapest.selling_price_inr ?? 999999)) e.cheapest = r;
        }
      }
      cheapestByKey = new Map([...byKey].filter(([, v]) => v.min !== v.max).map(([k, v]) => [k, v.cheapest]));
      if (variationBtn) {
        variationBtn.textContent = `Price varies by store (${cheapestByKey.size})`;
      }
    }

    function buildPriceSection(prices) {
      const min = prices[0].price, max = prices[prices.length - 1].price;
      const toggle = `<span class="toggle-stores">Show all ${prices.length} stores</span>`;

      if (min === max) {
        return `<div class="modal-section"><div class="sec-title">Price across stores</div>` +
          `<div class="price-row"><span class="store">${prices.length} stores have the same price</span>` +
          `<span class="amount">₹${min}</span></div>${toggle}</div>`;
      }

      const cheapest = prices.filter(p => p.price === min);
      const restCount = prices.length - cheapest.length;
      const savings = Math.round(((max - min) / max) * 100);
      const cheapestLabel = cheapest.length === 1 ? cheapest[0].store : `${cheapest.length} stores`;

      return `<div class="modal-section"><div class="sec-title">Price across stores</div>` +
        `<div class="price-compare">` +
        `<div class="price-card best">` +
        `<span class="pill best">cheapest</span>` +
        `<span class="pc-label">${cheapestLabel}</span>` +
        `<span class="pc-amount-row">${savings > 0 ? `<span class="save-tag">save ${savings}%</span>` : ''}<span class="pc-amount best">₹${min}</span></span></div>` +
        `<div class="price-card worst">` +
        `<span class="pill worst">priciest</span>` +
        `<span class="pc-label">${restCount} other store${restCount > 1 ? 's' : ''}</span>` +
        `<span class="pc-amount worst">₹${max}</span></div>` +
        `</div>${toggle}</div>`;
    }

    function openStoreListModal(prices) {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      const rows = prices.map(p =>
        `<div class="price-row"><span class="store">${p.store}${p.stock === 'Sold out' ? ' <span class="soldout">(sold out)</span>' : ''}</span>` +
        `<span class="amount">₹${p.price}</span></div>`
      ).join('');
      modal.innerHTML =
        `<div class="modal-card" style="width:360px;">` +
        `<div class="modal-head"><div class="name">All ${prices.length} stores</div>` +
        `<span class="modal-close">✕</span></div>` +
        `<div class="modal-section" style="border-top:none;">${rows}</div></div>`;
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
      modal.querySelector('.modal-close').addEventListener('click', () => modal.remove());
      document.body.appendChild(modal);
    }

    function openDetail(row) {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';

      const fields = DETAIL_COLS.map(c => {
        let val = row[c] ?? '-';
        if (c === 'selling_price_inr' && val !== '-') val = `<b>₹${val}</b>`;
        if (c === 'mrp_inr' && val !== '-') val = `₹${val}`;
        if (c === 'discount_pct' && val) val = `${val}% OFF`;
        if (c === 'store_address' && row.maps_url) {
          val = `${val} <br><a href="${row.maps_url}" target="_blank" rel="noopener noreferrer" style="font-weight:700;display:inline-block;margin-top:4px;">📍 Open in Google Maps ↗</a>`;
        }
        return `<div class="modal-field${DETAIL_FULL_WIDTH.has(c) ? ' full' : ''}">` +
          `<div class="k">${label(c)}</div><div class="v">${val}</div></div>`;
      }).join('');

      const prices = priceAcrossStores(row);
      const priceSection = prices.length > 1 ? buildPriceSection(prices) : '';

      const img = row.image_1
        ? `<img src="${row.image_1}" alt="${row.name}" onerror="this.style.display='none'">`
        : `<div style="width:48px;height:48px;border-radius:6px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:20px;">🛵</div>`;

      modal.innerHTML =
        `<div class="modal-card">` +
        `<div class="modal-head">${img}` +
        `<div class="name"><a href="${row.product_url}" target="_blank" rel="noopener noreferrer" class="prod-link" style="font-size:15px;">${row.name}</a></div>` +
        `<span class="modal-close">✕</span></div>` +
        `<div class="modal-grid">${fields}</div>` +
        priceSection + `</div>`;

      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
      modal.querySelector('.modal-close').addEventListener('click', () => modal.remove());
      const toggleEl = modal.querySelector('.toggle-stores');
      if (toggleEl) {
        toggleEl.addEventListener('click', () => openStoreListModal(prices));
      }
      document.body.appendChild(modal);
    }

    function openImage(src) {
      if (!src) return;
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;' +
        'align-items:center;justify-content:center;z-index:100;cursor:zoom-out;';
      modal.innerHTML = `<img src="${src}" style="max-width:85vw;max-height:85vh;border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.5);background:#fff;padding:8px;">`;
      modal.addEventListener('click', () => modal.remove());
      document.body.appendChild(modal);
    }

    function cellValue(row, col) {
      const v = row[col] ?? '';
      if (col === 'image_1') {
        return v
          ? `<img src="${v}" loading="lazy" class="thumb" data-src="${v}" onerror="this.outerHTML='<span class=\\'thumb-fallback\\'>🛵</span>'">`
          : `<span class="thumb-fallback">🛵</span>`;
      }
      if (col === 'name') {
        return `<a href="${row.product_url}" target="_blank" rel="noopener noreferrer" class="prod-link">${v}</a>`;
      }
      if (col === 'quantity') {
        return v ? `<span class="qty-tag">${v}</span>` : '-';
      }
      if (col === 'selling_price_inr') {
        return v != null ? `₹${v}` : '-';
      }
      if (col === 'mrp_inr') {
        return (v && v > row.selling_price_inr) ? `₹${v}` : '-';
      }
      if (col === 'discount_pct') {
        return v > 0 ? `<span style="color:var(--crate);font-weight:700;">${v}%</span>` : '-';
      }
      if (col === 'maps_url') {
        return v ? `<a href="${v}" target="_blank" rel="noopener noreferrer">📍 Map ↗</a>` : '-';
      }
      return String(v).replace(/</g, '&lt;');
    }

    function sortRows(rows) {
      if (!sortCol) return rows;
      const numeric = NUMERIC_COLS.has(sortCol);
      return [...rows].sort((a, b) => {
        let av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
        const cmp = numeric ? ((Number(av) || 0) - (Number(bv) || 0)) : String(av).localeCompare(String(bv));
        return cmp * sortDir;
      });
    }

    function renderRowHtml(r, i) {
      const trClass = r.stock === 'Sold out' ? 'sold-out' : 'in-stock';
      const cols = COLUMN_ORDER.filter(c => c in r);
      return `<tr class="${trClass}"><td class="nowrap"><button data-idx="${i}" class="view-btn" title="View details">👁</button></td>` +
        cols.map(c => {
          const cls = [NUMERIC_COLS.has(c) ? 'num' : '', NOWRAP_COLS.has(c) ? 'nowrap' : ''].filter(Boolean).join(' ');
          return `<td class="${cls}">${cellValue(r, c)}</td>`;
        }).join('') + '</tr>';
    }

    function updateTableStatus() {
      const statusEl = document.getElementById('tableStatus');
      if (!statusEl) return;
      const total = filteredRows.length;
      if (total === 0) {
        statusEl.textContent = '';
      } else if (renderedCount >= total) {
        statusEl.textContent = `✓ Showing all ${total.toLocaleString()} products`;
      } else {
        statusEl.textContent = `Showing ${renderedCount.toLocaleString()} of ${total.toLocaleString()} products • Scroll down to load more`;
      }
    }

    function appendNextChunk() {
      if (renderedCount >= filteredRows.length) return;
      const tbody = document.getElementById('tableBody');
      if (!tbody) return;

      const nextBatch = filteredRows.slice(renderedCount, renderedCount + PAGE_CHUNK);
      let html = '';
      for (let i = 0; i < nextBatch.length; i++) {
        html += renderRowHtml(nextBatch[i], renderedCount + i);
      }
      tbody.insertAdjacentHTML('beforeend', html);
      renderedCount += nextBatch.length;
      updateTableStatus();
    }

    function renderInitialTable() {
      if (!filteredRows.length) {
        tableWrap.innerHTML = '<div id="empty">No products match your filter criteria.</div>';
        return;
      }
      const cols = COLUMN_ORDER.filter(c => c in filteredRows[0]);
      const head = '<thead><tr><th></th>' + cols.map(c => {
        const arrow = sortCol === c ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
        return `<th data-col="${c}">${label(c)}${arrow}</th>`;
      }).join('') + '</tr></thead>';

      renderedCount = Math.min(PAGE_CHUNK, filteredRows.length);
      let bodyHtml = '';
      for (let i = 0; i < renderedCount; i++) {
        bodyHtml += renderRowHtml(filteredRows[i], i);
      }

      tableWrap.innerHTML = `<table>${head}<tbody id="tableBody">${bodyHtml}</tbody></table><div id="tableStatus" class="table-status-bar"></div>`;
      updateTableStatus();
      tableWrap.scrollTop = 0;
    }

    function applyFilter() {
      const q = filterEl.value.trim().toLowerCase();
      const store = storeSel.value;
      const brand = brandSel.value;
      const cat = catSel.value;
      const stock = stockSel.value;
      const base = onlyVariation ? [...cheapestByKey.values()] : allRows;

      const qTokens = q ? q.split(/\s+/).filter(Boolean) : [];

      const filtered = base.filter(r => {
        if (store && r.store_id !== store && r.store_locality !== store) return false;
        if (brand && r.brand !== brand) return false;
        if (cat && r.category !== cat) return false;
        if (stock && r.stock !== stock) return false;
        if (qTokens.length > 0) {
          const search = r._search;
          for (let i = 0; i < qTokens.length; i++) {
            if (!search.includes(qTokens[i])) return false;
          }
        }
        return true;
      });

      filteredRows = sortRows(filtered);
      renderInitialTable();
      updateMetaRibbon();
    }

    // Event delegation on tableWrap for high performance (zero per-row event listeners)
    tableWrap.addEventListener('click', (e) => {
      const th = e.target.closest('th[data-col]');
      if (th) {
        const col = th.dataset.col;
        sortDir = sortCol === col ? -sortDir : 1;
        sortCol = col;
        applyFilter();
        return;
      }

      const viewBtn = e.target.closest('.view-btn');
      if (viewBtn) {
        const idx = Number(viewBtn.dataset.idx);
        if (filteredRows[idx]) openDetail(filteredRows[idx]);
        return;
      }

      const thumb = e.target.closest('.thumb');
      if (thumb) {
        openImage(thumb.dataset.src);
        return;
      }
    });

    // Infinite scroll listener throttled by rAF
    let scrollScheduled = false;
    tableWrap.addEventListener('scroll', () => {
      if (scrollScheduled) return;
      scrollScheduled = true;
      requestAnimationFrame(() => {
        scrollScheduled = false;
        if (renderedCount >= filteredRows.length) return;
        const scrollBottom = tableWrap.scrollHeight - tableWrap.scrollTop - tableWrap.clientHeight;
        if (scrollBottom < 600) {
          appendNextChunk();
        }
      });
    }, { passive: true });

    function updateMetaRibbon() {
      const allStoresSet = new Set(allRows.map(r => r.store_id || r.store_locality));
      const filteredStoresSet = new Set(filteredRows.map(r => r.store_id || r.store_locality));
      const prices = (filteredRows.length ? filteredRows : allRows).map(r => r.selling_price_inr).filter(p => p != null);
      const minPrice = prices.length ? Math.min(...prices) : null;

      const isFiltered = (filteredRows.length < allRows.length) || (filterEl.value.trim() !== '') || (storeSel.value !== '') || (brandSel.value !== '') || (catSel.value !== '') || (stockSel.value !== '') || onlyVariation;

      const rowCountStr = isFiltered
        ? `<b>${filteredRows.length.toLocaleString()}</b> / ${allRows.length.toLocaleString()} rows`
        : `<b>${allRows.length.toLocaleString()}</b> rows`;

      const storeCountStr = isFiltered
        ? `<b>${filteredStoresSet.size}</b> / ${allStoresSet.size} stores`
        : `<b>${allStoresSet.size}</b> stores`;

      const metaEl = document.getElementById('metaCard');
      if (metaEl) {
        metaEl.innerHTML =
          `<span class="stat">${rowCountStr}</span>` +
          `<span class="stat">${storeCountStr}</span>` +
          (minPrice != null ? `<span class="stat">min <b>₹${minPrice}</b></span>` : '') +
          `<span class="stat">${new Date().toLocaleTimeString()}</span>`;
      }
    }

    function fillStoreOptions() {
      const storeMap = new Map();
      allRows.forEach(r => {
        const id = r.store_id || r.store_locality;
        if (!storeMap.has(id)) {
          storeMap.set(id, {
            id: id,
            locality: r.store_locality,
            count: 0
          });
        }
        storeMap.get(id).count++;
      });

      const stores = [...storeMap.values()].sort((a, b) => a.locality.localeCompare(b.locality));
      storeSel.innerHTML = '<option value="">All stores (' + stores.length + ')</option>';
      stores.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.locality} (${s.count})`;
        storeSel.appendChild(opt);
      });
    }

    function fillBrandOptions() {
      const brandCount = new Map();
      allRows.forEach(r => {
        if (r.brand) brandCount.set(r.brand, (brandCount.get(r.brand) || 0) + 1);
      });
      const brands = [...brandCount.keys()].sort((a, b) => a.localeCompare(b));
      brandSel.innerHTML = '<option value="">All brands (' + brands.length + ')</option>';
      brands.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = `${b} (${brandCount.get(b)})`;
        brandSel.appendChild(opt);
      });
    }

    function fillCategoryOptions() {
      const catCount = new Map();
      allRows.forEach(r => {
        if (r.category) catCount.set(r.category, (catCount.get(r.category) || 0) + 1);
      });
      const cats = [...catCount.keys()].sort((a, b) => a.localeCompare(b));
      catSel.innerHTML = '<option value="">All categories (' + cats.length + ')</option>';
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `${c} (${catCount.get(c)})`;
        catSel.appendChild(opt);
      });
    }

    function exportCSV() {
      const rowsToExport = filteredRows.length ? filteredRows : allRows;
      if (!rowsToExport.length) return alert('No data to download.');
      const headers = ['#', 'Store_Locality', 'Store_ID', 'Store_Address', 'Store_Pincode', 'Brand', 'Product_Title', 'Quantity', 'Selling_Price_INR', 'MRP_INR', 'Discount_Pct', 'Stock', 'Category', 'Sub_Category', 'Google_Maps_URL', 'Product_URL'];
      const rows = rowsToExport.map((r, i) => [
        i + 1,
        `"${(r.store_locality || '').replace(/"/g, '""')}"`,
        `"${r.store_id || ''}"`,
        `"${(r.store_address || '').replace(/"/g, '""')}"`,
        `"${r.store_pincode || ''}"`,
        `"${(r.brand || '').replace(/"/g, '""')}"`,
        `"${(r.name || '').replace(/"/g, '""')}"`,
        `"${(r.quantity || '').replace(/"/g, '""')}"`,
        r.selling_price_inr ?? '',
        r.mrp_inr ?? '',
        r.discount_pct || 0,
        `"${r.stock || ''}"`,
        `"${(r.category || '').replace(/"/g, '""')}"`,
        `"${(r.sub_category || '').replace(/"/g, '""')}"`,
        `"${r.maps_url || ''}"`,
        `"${r.product_url || ''}"`
      ]);
      const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `swiggy_instamart_${currentQuery || 'results'}_${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function initData(items, query) {
      currentQuery = query || '';
      if (document.getElementById('queryLabel')) {
        document.getElementById('queryLabel').textContent = currentQuery ? currentQuery : 'Instamart Hunter';
      }
      allRows = (items || []).map(normalizeRow);
      updateMetaRibbon();
      fillStoreOptions();
      fillBrandOptions();
      fillCategoryOptions();
      computeVariationKeys();
      applyFilter();
    }

    // Debounced text filter
    let filterDebounce = null;
    filterEl.addEventListener('input', () => {
      clearTimeout(filterDebounce);
      filterDebounce = setTimeout(applyFilter, 120);
    });

    storeSel.addEventListener('change', applyFilter);
    brandSel.addEventListener('change', applyFilter);
    catSel.addEventListener('change', applyFilter);
    stockSel.addEventListener('change', applyFilter);
    sortSel.addEventListener('change', () => {
      const v = sortSel.value;
      if (v === 'price-asc') { sortCol = 'selling_price_inr'; sortDir = 1; }
      else if (v === 'price-desc') { sortCol = 'selling_price_inr'; sortDir = -1; }
      else if (v === 'discount-desc') { sortCol = 'discount_pct'; sortDir = -1; }
      else if (v === 'brand-asc') { sortCol = 'brand'; sortDir = 1; }
      else if (v === 'title-asc') { sortCol = 'name'; sortDir = 1; }
      else if (v === 'store-asc') { sortCol = 'store_locality'; sortDir = 1; }
      applyFilter();
    });

    variationBtn.addEventListener('click', () => {
      onlyVariation = !onlyVariation;
      variationBtn.classList.toggle('active', onlyVariation);
      applyFilter();
    });

    document.getElementById('download').addEventListener('click', exportCSV);

    /* __DATA_INJECTION__ */

    // Fallback: window.opener
    try {
      if (!allRows.length && window.opener && window.opener.swiggyResults && window.opener.swiggyResults.length) {
        const q = window.opener.document?.getElementById('sw-h-query')?.value?.trim() || '';
        initData(window.opener.swiggyResults, q);
      }
    } catch(e) {}

    // Fallback: URL hash
    try {
      if (!allRows.length && location.hash && location.hash.length > 2) {
        const raw = decodeURIComponent(location.hash.slice(1));
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) initData(parsed, '');
        else if (parsed.items) initData(parsed.items, parsed.query || '');
      }
    } catch(e) {}
  </script>
</body>
</html>
