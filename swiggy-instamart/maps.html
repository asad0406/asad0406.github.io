    <script>
        const storesData = window.PODS_DATA || [];

        // Initialize Leaflet Map centered on Mumbai MMR
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: true
        }).setView([19.1150, 72.9000], 11);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Base Maps
        const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
        }).addTo(map);

        const osmHot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            maxZoom: 19,
            subdomains: ['a', 'b', 'c'],
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors, Tiles by <a href="https://www.hotosm.org/" target="_blank">HOT</a>'
        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri, Earthstar Geographics'
        });

        // Layer control
        L.control.layers({
            "🗺️ OpenStreetMap": osmStandard,
            "🎨 OSM Humanitarian": osmHot,
            "🛰️ Satellite": satellite
        }, null, { position: 'bottomleft' }).addTo(map);

        // Custom Swiggy Marker Icon
        function createSwiggyPointerIcon(podId) {
            const shortId = podId ? `#${podId.slice(-4)}` : 'POD';
            const svgPin = `
                <svg class="pointer-pin" viewBox="0 0 32 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 0C7.163 0 0 7.163 0 16C0 26 16 40 16 40C16 40 32 26 32 16C32 7.163 24.837 0 16 0Z" fill="#EA580C"/>
                    <circle cx="16" cy="15" r="10.5" fill="#FF7A1A"/>
                    <path d="M16 8C12.5 8 10 10.5 10 13.5C10 16.5 13.5 20.5 16 22C18.5 20.5 22 16.5 22 13.5C22 10.5 19.5 8 16 8Z" fill="#FFFFFF"/>
                    <circle cx="16" cy="13.5" r="3" fill="#EA580C"/>
                </svg>
            `;

            return L.divIcon({
                className: 'swiggy-pointer',
                iconSize: [32, 42],
                iconAnchor: [16, 38],
                popupAnchor: [0, -36],
                html: `
                    <div class="pointer-wrapper">
                        ${svgPin}
                        <span class="pointer-pod-pill">${shortId}</span>
                    </div>
                `
            });
        }

        // Copy coordinates utility
        window.copyCoords = function(coordsText, el) {
            navigator.clipboard.writeText(coordsText).then(() => {
                const orig = el.innerText;
                el.innerText = 'Copied!';
                setTimeout(() => el.innerText = orig, 1500);
            }).catch(() => {
                el.innerText = 'Copied!';
            });
        };

        // Marker Cluster
        const clusterGroup = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 32,
            spiderfyOnMaxZoom: true,
            disableClusteringAtZoom: 14
        });

        const markers = [];

        storesData.forEach(store => {
            const lat = store.coordinates?.latitude || 0;
            const lng = store.coordinates?.longitude || 0;
            if (!lat || !lng) return;

            const formattedCoords = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            const icon = createSwiggyPointerIcon(store.podId || '');
            const marker = L.marker([lat, lng], { icon: icon });

            const darkStoreAddr = store.primaryServingAddress || store.address || 'Address not listed';
            const liveServingAddr = store.liveSwiggyAddress || store.deliveryLocation || '';
            const mapsUrl = store.mapsUrl || `https://www.google.com/maps?q=${lat},${lng}`;

            const popupContent = `
                <div class="popup-card">
                    <div class="popup-header">
                        <span class="popup-title">${store.locality}</span>
                        <span class="pod-tag">Pod #${store.podId}</span>
                    </div>
                    <div class="popup-sub">
                        <span class="status-badge">● Active Dark Store</span>
                        ${store.pincode ? `<span class="pin-badge">📮 ${store.pincode}</span>` : ''}
                        ${store.seller ? `<span class="seller-badge">${store.seller}</span>` : ''}
                    </div>
                    <div class="popup-addr-box">
                        <span class="addr-label">Dark Store Address</span>
                        <span class="addr-text">${darkStoreAddr}</span>
                    </div>
                    ${liveServingAddr && liveServingAddr !== darkStoreAddr ? `
                    <div class="popup-addr-box">
                        <span class="addr-label">Primary Serving Location</span>
                        <span class="addr-text">${liveServingAddr}</span>
                    </div>` : ''}
                    <div class="popup-actions">
                        <span class="coords-tag" onclick="copyCoords('${formattedCoords}', this)" title="Click to copy coordinates">
                            📍 ${formattedCoords}
                        </span>
                        <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="maps-link">
                            Open in Maps ↗
                        </a>
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent, { maxWidth: 300 });

            marker.storeData = {
                locality: (store.locality || '').toLowerCase(),
                podId: (store.podId || '').toLowerCase(),
                pincode: (store.pincode || '').toLowerCase(),
                address: ((store.primaryServingAddress || '') + ' ' + (store.liveSwiggyAddress || '')).toLowerCase(),
                seller: (store.seller || '').toLowerCase(),
                lat,
                lng,
                markerRef: marker
            };

            markers.push(marker);
            clusterGroup.addLayer(marker);
        });

        map.addLayer(clusterGroup);

        // Update count badge
        const countEl = document.getElementById('activeCount');
        if (countEl) countEl.innerText = markers.length;

        // Search filtering
        const searchInput = document.getElementById('searchInput');
        let searchDebounce = null;

        function doSearch() {
            const query = (searchInput.value || '').trim().toLowerCase();
            clusterGroup.clearLayers();

            let matched = 0;
            const matchedMarkers = [];

            markers.forEach(m => {
                const d = m.storeData;
                const match = !query || 
                    d.locality.includes(query) || 
                    d.podId.includes(query) || 
                    d.pincode.includes(query) || 
                    d.address.includes(query) || 
                    d.seller.includes(query);

                if (match) {
                    clusterGroup.addLayer(m);
                    matchedMarkers.push(m);
                    matched++;
                }
            });

            if (countEl) countEl.innerText = matched;

            if (matchedMarkers.length === 1) {
                const single = matchedMarkers[0];
                map.setView([single.storeData.lat, single.storeData.lng], 15);
                setTimeout(() => single.openPopup(), 250);
            } else if (matchedMarkers.length > 1 && query.length > 0) {
                const group = L.featureGroup(matchedMarkers);
                map.fitBounds(group.getBounds().pad(0.15));
            }
        }

        searchInput.addEventListener('input', () => {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(doSearch, 150);
        });

        // Keyboard shortcut: '/' to focus search
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
